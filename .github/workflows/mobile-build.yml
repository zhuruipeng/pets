name: Build pet app packages

on:
  push:
    branches: [main, codex/pet-profile-p01-p11]
    paths:
      - app/**
      - .github/workflows/mobile-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pet-mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  COCOAPODS_DISABLE_STATS: 'true'

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.region }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
            region: cn
            format: apk
          - platform: android
            runner: ubuntu-24.04
            region: intl
            format: apk
          - platform: ios
            runner: macos-15
            region: cn
            format: unsigned
          - platform: ios
            runner: macos-15
            region: intl
            format: unsigned
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Configure platform tools
        shell: bash
        run: |
          flutter config --no-analytics --no-enable-swift-package-manager
          if [ "${{ matrix.platform }}" = android ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
            flutter precache --android
          else
            xcodebuild -version
            pod --version
            flutter precache --ios
          fi
      - name: Resolve locked dependencies
        working-directory: app
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: flutter pub get --enforce-lockfile
      - name: Build platform package
        working-directory: app
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: python3 tool/build_mobile.py --platform ${{ matrix.platform }} --region ${{ matrix.region }} --format ${{ matrix.format }}
      - name: Package Android validation APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p dist
          cp "app/build/app/outputs/flutter-apk/app-${{ matrix.region }}-release.apk" "dist/MyPet-${{ matrix.region }}-0.1.14+24-android-validation.apk"
      - name: Package unsigned iOS IPA
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ipa-${{ matrix.region }}/Payload" dist
          ditto app/build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa-${{ matrix.region }}/Payload/Runner.app"
          (cd "$RUNNER_TEMP/ipa-${{ matrix.region }}" && ditto --norsrc -c -k --keepParent Payload "$GITHUB_WORKSPACE/dist/MyPet-${{ matrix.region }}-0.1.14+24-ios-unsigned.ipa")
      - name: Record package checksum
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          for path in Path('dist').iterdir():
              if path.suffix in ('.apk', '.ipa'):
                  digest = hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
                  path.with_suffix(path.suffix + '.sha256').write_text(f'{digest}  {path.name}\n')
          Path('dist/SOURCE.txt').write_text(f"Commit: {os.environ['GITHUB_SHA']}\nVersion: 0.1.14+24\nFlutter: 3.47.9\nAndroid: validation signing; iOS: unsigned.\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pet-${{ matrix.platform }}-${{ matrix.region }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    needs: build
    if: github.ref == 'refs/heads/codex/pet-profile-p01-p11' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish the four built packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh run download "$GITHUB_RUN_ID" --dir packages
          mapfile -t assets < <(find packages -type f \( -name '*.apk' -o -name '*.ipa' -o -name '*.sha256' \) | sort)
          test "${#assets[@]}" -eq 8
          gh release create "pet-profile-0.1.14-build-$GITHUB_RUN_NUMBER" "${assets[@]}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "我的宠物 0.1.14+24 · 注销提示修复验证包" \
            --notes-file docs/pet-profile-build.md
