name: pet_app
description: 我的宠物 — 宠物健康管理与提醒（中国 + 海外双市场）
publish_to: 'none'
version: 0.1.8+17

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 基础
  intl: ^0.20.3
  http: ^1.2.2
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.4
  archive: ^4.3.0
  crypto: ^3.0.7

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 本地数据库（本地优先，sqflite + 手写 DDL）
  sqflite: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  # sqflite 的纯接口包，**显式声明**是因为 lib 里有代码直接引它：
  # SyncEngine 只要 Database / ConflictAlgorithm 这两个类型，不要 Flutter 实现。
  # 少了这一条它会通过 sqflite 传递依赖被解析到，但那样属于「用了没声明的依赖」，
  # 上游哪天改依赖树就会突然编译不过。
  sqflite_common: ^2.5.13

  # 定位与地图（海外渲染底图，国内不渲染，见 region.dart）
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # 本地通知（MVP 不做服务端推送，故无需 FCM / 厂商通道）
  flutter_local_notifications: ^17.2.2
  # flutter_local_notifications 的 zonedSchedule 依赖它，必须显式声明
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # UI
  fl_chart: ^0.69.0
  share_plus: ^10.0.0

  # 打开法律文本的网页版链接。
  # 目前只 share_plus 间接依赖它，但 **legal_page.dart 直接 import 了
  # launchUrl** —— 属于「用了没声明的依赖」。share_plus 哪天升版调整依赖树，
  # 这里就会突然编译不过，而报错信息（找不到 launchUrl）完全看不出是这个原因。
  # 显式声明才不会受上游摆布。
  url_launcher: ^6.3.0

  # 记录附件（M3.3）：给用药/就诊等记录挂照片。系统相册/相机，无需自管权限页
  image_picker: ^1.1.2

  # 自动更新：读本机的 versionName / versionCode 去和服务端清单比对。
  # 版本号不能在 Dart 侧硬编码 —— 那份数字和 pubspec 里的 version 是两处，
  # 迟早对不上。
  package_info_plus: ^8.0.0

  # 登录令牌的落盘（M6 收口）：Android Keystore / iOS Keychain。
  # 令牌不再躺在 SQLite 的 sync_meta 里明文放着，见 lib/data/sync/token_store.dart。
  #
  # ⚠️ 装了这个包就要同时做两件事，漏掉任何一件都会在真机上出问题：
  #   1. 把插件的密文从**云备份里排除** —— 备份会把密文搬到新手机，
  #      但解开它的 Keystore 密钥不可导出、不会跟着走，新机上解密必失败。
  #      见 android/app/src/main/res/xml/{backup_rules,data_extraction_rules}.xml，
  #      两份都要有：Android 12+ 只读后者，12 以下只读前者。
  #   2. **minSdk ≥ 23**（插件 v10 起换成自己实现的密码学，要求 API 23）。
  #      本项目用的是 flutter.minSdkVersion，本机实测为 24，满足。
  #      将来若有人把它调低，构建会直接失败，不会静默降级成弱加密。
  #
  # ⚠️ **不要升到 11.x**：11 起依赖 win32 ^6，而本项目的 share_plus 10 依赖
  # win32 ^5，pub 会直接解不出来（已实测报 version solving failed）。
  # 10.x 已经是我们需要的那个版本 —— 它正是把旧的 Jetpack Security
  # （encryptedSharedPreferences）换成自实现 RSA-OAEP + AES-GCM 的那一版，
  # 11.x 新增的是生物识别增强，本 App 用不到。
  flutter_secure_storage: ^10.3.4

  # 文档原件（M8）：给记录挂 PDF / Word / 图片等原件。
  # image_picker 只认系统相册与相机，取不到「下载目录里的化验单 PDF」，
  # 所以文档走 file_selector（**Flutter 官方**插件，与 image_picker 一家人）。
  # 入口：openFile(acceptedTypeGroups: [XTypeGroup(extensions: [...])])。
  #
  # ⚠️ **别换回 file_picker**（2026-10-01 两次构建失败都栽在它）：
  #   - 11.x 的 android/build.gradle 在 AGP ≥ 9 时不套 kotlin-android 插件，
  #     本机（AGP 9.1.0 + Gradle 9.3.1）下 Kotlin 源码被静默跳过，编译产物
  #     只剩 R.class → GeneratedPluginRegistrant 找不到类 → 构建失败 4m37s。
  #   - 8.x 全系列把 compileSdk 34 写死，低于其它插件要求的 36，
  #     checkReleaseAarMetadata 直接拒绝（FAILED in 1m17s）。
  #   file_selector 的 android 模块写的是 `compileSdk = flutter.compileSdkVersion`，
  #   跟着 Flutter 走，没有这两类坑。
  #
  # **只存本机**：选到的文件拷进应用文档目录，不上传服务端
  # （见 schema 里 attachments.local_only 与同步触发器的 WHEN 条件）。
  # 打开方式走 share_plus 起系统分享页，不引 PDF 渲染库 —— 那类库动辄
  # +5MB 且要 embed 字体，为一个「能看」的入口不值。
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 仓储测试跑在内存 SQLite 上，需要 FFI 实现
  sqflite_common_ffi: ^2.3.3

# 注意：以上版本号为 2026-09 的参考值。
# 首次拉取后请执行 `flutter pub upgrade --major-versions` 对齐最新稳定版。

flutter:
  # 保持现有 CocoaPods 工程；换 Mac 时不依赖机器上的 Flutter 全局开关。
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    # ⚠️ 原来这里还声明了 `assets/i18n/`，但那个目录从不存在、也没有任何代码
    # 读它 —— 界面文案全在 `lib/core/l10n.dart` 的 Dart 字符串表里（`_zh` / `_en`）。
    # 后果是每次 `flutter pub get` / `flutter test` / `flutter build` 都刷一行
    #    Error: unable to find directory entry in pubspec.yaml
    # 而且它会**掩盖真正的资源错误** —— 真正漏打包的 assets 混在这一行里，
    # 久了就没人当回事了。声明一个不存在的目录属于净负债，直接删掉。
    #
    # 隐私政策与用户协议（上架要求 App 内可打开）。
    # 源文件在 docs/store/ 下，改完记得复制过来 —— 两处内容必须一致，
    # 商店审核会同时看网页版和 App 内版本。
    - assets/legal/
